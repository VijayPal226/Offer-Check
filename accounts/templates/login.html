{% extends "base.html" %}

{% block title %}Login — OfferCheck{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container py-4">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="text-center mb-4">

                    <span class="badge rounded-pill bg-primary-subtle text-primary px-3 py-2 mb-3">
                        Welcome Back
                    </span>

                    <h1 class="fw-bold display-6">
                        Sign in to OfferCheck
                    </h1>

                    <p class="text-secondary">
                        Continue your opportunity research journey.
                    </p>

                </div>


                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                    <div class="card-body p-4 p-lg-5">

                        <form method="POST">

                            {% csrf_token %}

                            <div class="mb-4">

                                <label class="form-label fw-semibold">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control form-control-lg rounded-3"
                                    placeholder="Enter your username"
                                    required
                                >

                            </div>


                            <div class="mb-4">

                                <div class="d-flex justify-content-between">

                                    <label class="form-label fw-semibold">
                                        Password
                                    </label>

                                    <a href="#"
                                       class="text-primary text-decoration-none small">
                                        Forgot password?
                                    </a>

                                </div>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control form-control-lg rounded-3"
                                    placeholder="Enter your password"
                                    required
                                >

                            </div>


                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember"
                                    name="remember"
                                >

                                <label class="form-check-label text-secondary"
                                       for="remember">
                                    Remember me
                                </label>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold">
                                Sign In
                            </button>

                        </form>


                        <div class="text-center mt-4">

                            <span class="text-secondary">
                                Don't have an account?
                            </span>

                            <a href="{% url 'register' %}"
                               class="text-primary fw-semibold text-decoration-none">
                                Create Account
                            </a>

                        </div>

                    </div>

                </div>


                <div class="text-center mt-4">

                    <a href="{% url 'home' %}"
                       class="text-secondary text-decoration-none small">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

    </div>
</section>

{% endblock %}
