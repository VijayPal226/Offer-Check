{% extends "base.html" %}

{% block title %}Create Account — OfferCheck{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container py-4">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8">

                <div class="text-center mb-4">

                    <span class="badge rounded-pill bg-primary-subtle text-primary px-3 py-2 mb-3">
                        Get Started
                    </span>

                    <h1 class="fw-bold display-6">
                        Create your account
                    </h1>

                    <p class="text-secondary">
                        Join OfferCheck and start exploring opportunities.
                    </p>

                </div>


                <div class="card border-0 shadow-lg rounded-4">

                    <div class="card-body p-4 p-lg-5">

                        <form method="POST">

                            {% csrf_token %}


                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        First Name
                                    </label>

                                    <input
                                        type="text"
                                        name="first_name"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="First name"
                                        required
                                    >

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Last Name
                                    </label>

                                    <input
                                        type="text"
                                        name="last_name"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="Last name"
                                        required
                                    >

                                </div>


                                <div class="col-12">

                                    <label class="form-label fw-semibold">
                                        Username
                                    </label>

                                    <input
                                        type="text"
                                        name="username"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="Choose a username"
                                        required
                                    >

                                </div>


                                <div class="col-12">

                                    <label class="form-label fw-semibold">
                                        Email Address
                                    </label>

                                    <input
                                        type="email"
                                        name="email"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="you@example.com"
                                        required
                                    >

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        name="password"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="Create password"
                                        required
                                    >

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Confirm Password
                                    </label>

                                    <input
                                        type="password"
                                        name="confirm_password"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="Confirm password"
                                        required
                                    >

                                </div>

                            </div>


                            <div class="form-check mt-4 mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    required
                                >

                                <label class="form-check-label text-secondary"
                                       for="terms">

                                    I agree to the
                                    <a href="#"
                                       class="text-primary text-decoration-none">
                                        Terms & Conditions
                                    </a>

                                </label>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold">
                                Create Account
                            </button>

                        </form>


                        <div class="text-center mt-4">

                            <span class="text-secondary">
                                Already have an account?
                            </span>

                            <a href="{% url 'login' %}"
                               class="text-primary fw-semibold text-decoration-none">
                                Sign In
                            </a>

                        </div>

                    </div>

                </div>


                <div class="text-center mt-4">

                    <a href="{% url 'home' %}"
                       class="text-secondary text-decoration-none small">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

    </div>
</section>

{% endblock %}
